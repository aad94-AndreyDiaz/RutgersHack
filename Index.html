<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Food Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin: 16px 0 6px;
      color: #1db97a;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 16px;
    }

    #camera-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      border: 3px solid #1db97a44;
      border-radius: 16px;
      pointer-events: none;
    }

    /* scanning animation */
    #scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #1db97a, transparent);
      top: 0;
      display: none;
      animation: scandown 1.2s linear infinite;
    }

    @keyframes scandown {
      from { top: 0; }
      to   { top: 100%; }
    }

    #scan-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: #1db97a;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #scan-btn:active  { transform: scale(0.97); }
    #scan-btn:disabled { background: #444; cursor: not-allowed; }

    #result-card {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
      background: #1a1a2e;
      border-radius: 16px;
      padding: 20px;
      display: none;
      border: 1px solid #1db97a33;
    }

    #result-card h2 {
      font-size: 1.4rem;
      color: #1db97a;
      margin-bottom: 4px;
    }

    #confidence {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 14px;
    }

    #nutrition {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #ccc;
    }

    #nutrition span {
      display: inline-block;
      background: #0f1117;
      border-radius: 8px;
      padding: 4px 10px;
      margin: 3px;
      font-size: 0.85rem;
      border: 1px solid #333;
    }

    #error-msg {
      margin-top: 12px;
      color: #e05;
      font-size: 0.85rem;
      display: none;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <h1>🍽 Food Scanner</h1>
  <p class="subtitle">Point your camera at food and tap Scan</p>

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay">
      <div id="scan-line"></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <button id="scan-btn">📸 SCAN FOOD</button>

  <div id="result-card">
    <h2 id="food-name">—</h2>
    <div id="confidence"></div>
    <div id="nutrition"></div>
  </div>

  <div id="error-msg"></div>

  <script>
    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const btn      = document.getElementById('scan-btn');
    const card     = document.getElementById('result-card');
    const nameEl   = document.getElementById('food-name');
    const confEl   = document.getElementById('confidence');
    const nutriEl  = document.getElementById('nutrition');
    const errEl    = document.getElementById('error-msg');
    const scanLine = document.getElementById('scan-line');

    // ── Start camera (rear on phone, any on desktop) ──
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        video.srcObject = stream;
      } catch (e) {
        errEl.style.display = 'block';
        errEl.textContent = 'Camera access denied. Please allow camera and reload.';
      }
    }
    startCamera();

    // ── Scan button ──
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      card.style.display = 'none';
      errEl.style.display = 'none';
      scanLine.style.display = 'block';

      // capture frame from video
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const imageData = canvas.toDataURL('image/jpeg', 0.8);

      try {
        const res  = await fetch('/scan', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ image: imageData })
        });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        // parse nutrition string into badges
        const badges = data.nutrition.split('|').map(part => {
          return `<span>${part.trim()}</span>`;
        }).join('');

        nameEl.textContent  = data.name;
        confEl.textContent  = `${data.confidence}% match`;
        nutriEl.innerHTML   = badges;
        card.style.display  = 'block';

      } catch (e) {
        errEl.style.display = 'block';
        errEl.textContent   = 'Error: ' + e.message;
      }

      scanLine.style.display = 'none';
      btn.disabled    = false;
      btn.textContent = '📸 SCAN FOOD';
    });
  </script>
</body>
</html>
